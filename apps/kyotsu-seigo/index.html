let marks={};
try{marks=JSON.parse(localStorage.getItem('cfc-marks')||'{}')}catch(e){marks={}}
function save(){try{localStorage.setItem('cfc-marks',JSON.stringify(marks))}catch(e){}}
let ch=1,flt='all';
function fromHash(){const m=(location.hash||'').match(/^#ch([1-5])$/);ch=m?+m[1]:1}
const tabs=document.getElementById('tabs');
CH.forEach((t,i)=>{const b=document.createElement('button');b.className='tab';b.textContent=`${i+1}. ${t}`;b.onclick=()=>{location.hash='ch'+(i+1)};tabs.appendChild(b)});
document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{flt=c.dataset.f;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===c));render()});
function markHTML(id){const m=marks[id];return m==='y'?'<span class="mark ok">○ できた</span>':m==='n'?'<span class="mark ng">× まちがえた</span>':'<span class="mark"></span>'}
function card(it){
  const el=document.createElement('section');el.className='card';el.id='q-'+it.id;
  el.innerHTML=`<div class="meta"><span class="no">${it.ch}-${it.n}</span><span>${it.y}年度</span><span class="badge ${it.c?'c':''}">${it.ex}</span><span>${it.q}</span>${markHTML(it.id)}</div>
  <div class="pb"><img class="img" loading="lazy" src="${it.p}" width="${it.pw}" height="${it.ph}" alt="${it.y}年度 ${it.ex} ${it.q}"></div>
  <button class="reveal">解答を見る</button>
  <div class="ansbox"><div class="ansline"><span class="lb">正解</span><span class="v">${it.a}</span></div>
  <div class="kb"><img class="img" loading="lazy" data-src="${it.k}" width="${it.kw}" height="${it.kh}" alt="解答・解説"></div>
  <div class="self"><button class="y">○ できた</button><button class="n">× まちがえた</button></div></div>`;
  const rb=el.querySelector('.reveal'),ki=el.querySelector('.kb img');
  rb.onclick=()=>{const o=el.classList.toggle('open');rb.textContent=o?'解答を隠す':'解答を見る';if(o&&!ki.src)ki.src=ki.dataset.src};
  const y=el.querySelector('.self .y'),n=el.querySelector('.self .n');
  function sync(){y.classList.toggle('on',marks[it.id]==='y');n.classList.toggle('on',marks[it.id]==='n');el.querySelector('.mark').outerHTML=markHTML(it.id);stat()}
  y.onclick=()=>{marks[it.id]=marks[it.id]==='y'?undefined:'y';if(!marks[it.id])delete marks[it.id];save();sync()};
  n.onclick=()=>{marks[it.id]=marks[it.id]==='n'?undefined:'n';if(!marks[it.id])delete marks[it.id];save();sync()};
  y.classList.toggle('on',marks[it.id]==='y');n.classList.toggle('on',marks[it.id]==='n');
  return el}
function list(){return D.filter(it=>it.ch===ch).filter(it=>flt==='all'||(flt==='kyotsu'&&!it.c)||(flt==='center'&&it.c)||(flt==='ng'&&marks[it.id]==='n')||(flt==='un'&&!marks[it.id]))}
function stat(){const all=D.filter(it=>it.ch===ch);const ok=all.filter(it=>marks[it.id]==='y').length,ng=all.filter(it=>marks[it.id]==='n').length;document.getElementById('stat').textContent=`○${ok}　×${ng}　／${all.length}問`}
function render(){
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('on',i+1===ch));
  const on=document.querySelector('.tab.on');if(on)on.scrollIntoView({inline:'center',block:'nearest'});
  const M=document.getElementById('main');M.innerHTML='';
  const h=document.createElement('div');h.className='chtitle';h.textContent=`第${ch}章　${CH[ch-1]}`;M.appendChild(h);
  const L=list();let g=null;
  if(!L.length){const e=document.createElement('div');e.className='empty';e.textContent='該当する問題はありません';M.appendChild(e)}
  L.forEach(it=>{const gg=it.c?'センター試験':'共通テスト';if(gg!==g){g=gg;const d=document.createElement('div');d.className='grp';d.textContent=gg;M.appendChild(d)}M.appendChild(card(it))});
  stat()}
window.addEventListener('hashchange',()=>{fromHash();render();window.scrollTo(0,0)});
document.getElementById('top').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
fromHash();render();
