<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<script>if(sessionStorage.getItem("pw_化学")!=="ok"){location.replace("/pdf-site/");}</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>化学ファイナルチェックお試し</title>
<link rel="stylesheet" href="katex/katex.min.css?v=202611130008">
<style>
:root{--navy:#13254a;--teal:#007878;--amber:#d18f1f;--ink:#1f2328;--sub:#5b6270;--line:#e3e6ea;--bg:#f6f7f9;--ok:#1a7f4b;--ng:#c0392b;--okbg:#e8f5ee;--ngbg:#fbeceb}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;line-height:1.5}
button{font-family:inherit}
header{background:#fff;border-bottom:1px solid var(--line)}
.hd{max-width:760px;margin:0 auto;padding:14px 16px 12px}
.hd .kicker{font-size:12px;letter-spacing:.08em;color:var(--teal);font-weight:700}
.hd .kicker a{color:inherit}
.hd h1{margin:2px 0 4px;font-size:21px;color:var(--navy)}
.hd p{margin:0;font-size:13px;color:var(--sub)}
.go-run{margin-top:10px;display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;background:var(--teal);color:#fff;font-size:14px;font-weight:700;padding:9px 16px;cursor:pointer}
nav{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
body.running nav,body.running header{display:none}
.tabs{max-width:760px;margin:0 auto;display:flex;gap:6px;overflow-x:auto;padding:8px 12px 6px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;color:var(--ink);cursor:pointer;white-space:nowrap}
.tab.on{background:var(--navy);border-color:var(--navy);color:#fff}
.filters{max-width:760px;margin:0 auto;display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:0 12px 8px;font-size:12px}
.chip{border:1px solid var(--line);background:#fff;border-radius:6px;padding:4px 9px;cursor:pointer;color:var(--sub)}
.chip.on{border-color:var(--teal);color:var(--teal);font-weight:700;background:#eef7f7}
.stat{margin-left:auto;color:var(--sub)}
main{max-width:760px;margin:0 auto;padding:12px 10px 70px}
.chtitle{font-size:16px;font-weight:700;color:var(--navy);margin:8px 6px 10px;border-left:5px solid var(--teal);padding-left:8px}
.grp{font-size:13px;font-weight:700;color:var(--sub);margin:18px 6px 8px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;margin:0 0 14px;overflow:hidden;scroll-margin-top:96px}
.meta{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);font-size:13px;flex-wrap:wrap}
.no{font-weight:700;color:var(--navy)}
.badge{font-size:11px;padding:1px 6px;border-radius:4px;background:#eceff3;color:#333}
.badge.c{background:#3a3f47;color:#fff}
.mark{margin-left:auto;font-size:13px;font-weight:700}
.mark.ok{color:var(--ok)}.mark.ng{color:var(--ng)}
.hint{font-size:11.5px;color:var(--sub);padding:7px 14px 0}
/* 本文 */
.pb,.kb{padding:6px 14px 8px;font-size:15px;line-height:1.8}
.pb p,.kb p{margin:.45em 0}
.katex{font-size:1.04em}
.katex .mathrm{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}
.m.d{display:block;overflow-x:auto;overflow-y:hidden;padding:2px 0}
.ctr{text-align:center}
.figw{text-align:center;margin:10px 0}
.fig{max-width:100%;height:auto}
.ifig{max-width:100%;height:auto;vertical-align:middle}
u{text-decoration:none;border-bottom:1px solid currentColor;padding-bottom:1px}
.wave{text-decoration:underline wavy;text-underline-offset:4px}
.ffbox{display:inline-block;border:1px solid #333;padding:0 .9em;margin:0 .2em;line-height:1.4;font-weight:700}
.fbox{border:1px solid #333;padding:0 .2em}
.note{border:1px solid var(--line);background:#f8f9fb;border-radius:6px;padding:4px 10px;margin:8px 0;font-size:14px}
.exb{font-size:11px;border:1px solid #333;padding:0 3px}
.lst{list-style:none;margin:6px 0;padding:0}
.lst>li{display:flex;align-items:flex-start;gap:6px;padding:5px 0}
.lst>li.st{border-top:1px dashed #eef0f3}
.lst>li .lb{flex:none;min-width:1.6em;font-weight:700}
.lst>li .bd{flex:1;min-width:0}
.lst>li .bd p{margin:0}
.chs{display:flex;flex-wrap:wrap;gap:4px 18px;margin:8px 0 6px 1em}
.ch .lb{font-weight:700}
table.sg{border-collapse:collapse;margin:10px auto;font-size:14px}
table.sg th,table.sg td{border:1px solid #888;padding:2px 12px;text-align:center}
table.sg td.g{color:#000}
.tw{overflow-x:auto;margin:8px 0}
table.tb{border-collapse:collapse;margin:0 auto;font-size:14px}
table.tb td{border:1px solid #888;padding:3px 8px}
/* ○×判定 */
.jg{flex:none;display:inline-flex;align-items:center;gap:4px;margin-left:4px}
.jb{width:34px;height:30px;border-radius:7px;border:1px solid #cfd5dc;background:#fff;font-size:16px;font-weight:700;color:#7a828e;cursor:pointer;padding:0}
.jb[data-v="1"].on{background:#2f6fd6;border-color:#2f6fd6;color:#fff}
.jb[data-v="0"].on{background:#d6602f;border-color:#d6602f;color:#fff}
.jg .tv{display:none;min-width:30px;text-align:center;font-weight:700;font-size:14px;border-radius:6px;padding:2px 0}
.jg.shown .tv{display:inline-block}
.jg.shown .jb{cursor:default}
.jg.shown .jb:not(.on){display:none}
.tv.sei{color:var(--ok);border:1.5px solid var(--ok)}
.tv.go{color:var(--ng);border:1.5px solid var(--ng)}
.jg.ok .jb.on{box-shadow:0 0 0 2px var(--ok)}
.jg.ng .jb.on{box-shadow:0 0 0 2px var(--ng)}
.jg.ok::after{content:"✓";color:var(--ok);font-weight:700}
.jg.ng::after{content:"✗";color:var(--ng);font-weight:700}
.jp{margin:10px 0 4px;border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.jph{font-size:12px;color:var(--sub);font-weight:700}
.jpr{display:flex;align-items:center;gap:6px;padding:4px 0}
.jpr .lb{font-weight:700}.jpr .bd{flex:1;font-size:13px;color:var(--sub)}
/* 紙面 */
.orig{padding:0 14px 4px;text-align:right}
.orig .ob{border:0;background:none;color:var(--teal);font-size:12px;cursor:pointer;padding:2px 0;text-decoration:underline}
.orig img{display:none;width:100%;height:auto;margin-top:6px;border:1px solid var(--line);text-align:left}
.orig.on img{display:block}
/* 解答 */
.reveal{display:block;width:calc(100% - 24px);margin:8px 12px 12px;padding:11px;border:0;border-radius:8px;background:var(--navy);color:#fff;font-size:15px;font-weight:700;cursor:pointer}
.ansbox{display:none;border-top:1px dashed var(--line);background:#fbfcfd}
.card.open .ansbox{display:block}
.card.open .reveal{background:#e9ecf1;color:var(--navy)}
.res{margin:10px 12px 0;font-size:14px;border-radius:8px;padding:0}
.res.ok,.res.ng{padding:8px 12px}
.res.ok{background:var(--okbg);color:var(--ok)}.res.ng{background:var(--ngbg);color:var(--ng)}
.res .auto{font-size:12px;color:var(--sub)}
.ansline{display:flex;align-items:center;gap:10px;padding:12px 14px 2px}
.ansline .lbl{font-size:13px;color:var(--sub)}
.ansline .v{font-size:20px;font-weight:700;color:var(--ng)}
.kb{font-size:14.5px}
.mh{font-weight:700;margin:10px 0 2px;color:var(--navy)}
.mh2{font-weight:700;margin:8px 0 2px}
.ht{list-style:none;padding:0;margin:4px 0}
.ht li{display:flex;gap:6px;align-items:flex-start;padding:3px 0}
.ht .lb{flex:none;min-width:1.6em;font-weight:700}
.ht .tz{flex:none;width:1.8em;text-align:center;font-weight:700;font-size:13px;margin-top:2px}
.tz.sei{color:var(--ok)}.tz.go{color:#fff;background:var(--ng);border-radius:4px}
.ht .bd{flex:1;min-width:0}.ht .bd p{margin:0}
.self{display:flex;gap:8px;padding:6px 12px 12px}
.self button{flex:1;padding:9px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:14px;cursor:pointer}
.self .y.on{background:var(--ok);border-color:var(--ok);color:#fff}
.self .n.on{background:var(--ng);border-color:var(--ng);color:#fff}
.after .next{display:block;width:calc(100% - 24px);margin:0 12px 14px;padding:12px;border:0;border-radius:8px;background:var(--teal);color:#fff;font-size:15px;font-weight:700;cursor:pointer}
.empty{text-align:center;color:var(--sub);padding:40px 0;font-size:14px}
.top{position:fixed;right:14px;bottom:16px;width:44px;height:44px;border-radius:50%;border:0;background:var(--navy);color:#fff;font-size:18px;box-shadow:0 2px 8px rgba(0,0,0,.2);cursor:pointer}
/* 演習モード */
.rbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.97);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:0 0 12px;font-size:14px}
.rpos{font-weight:700;color:var(--navy);white-space:nowrap}
.rprog{flex:1;height:6px;background:#e9ecf1;border-radius:3px;overflow:hidden}
.rprog i{display:block;height:100%;background:var(--teal)}
.rtime{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.rtime.warn{color:var(--ng)}
.rquit{border:1px solid var(--line);background:#fff;border-radius:6px;padding:4px 10px;font-size:13px;cursor:pointer}
.setup{position:fixed;inset:0;z-index:50;background:rgba(19,37,74,.35);display:none;align-items:flex-end;justify-content:center}
.setup.on{display:flex}
.sbox{background:#fff;width:100%;max-width:560px;border-radius:14px 14px 0 0;padding:16px 16px 20px;max-height:92vh;overflow-y:auto}
@media(min-width:600px){.setup{align-items:center}.sbox{border-radius:14px}}
.sbox h2{margin:0 0 8px;font-size:18px;color:var(--navy)}
.sbox fieldset{border:0;margin:0 0 10px;padding:0}
.sbox legend{font-size:12px;font-weight:700;color:var(--sub);margin-bottom:4px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts label{position:relative}
.opts input{position:absolute;opacity:0}
.opts span{display:inline-block;border:1px solid var(--line);border-radius:7px;padding:6px 10px;font-size:13px;cursor:pointer;background:#fff}
.opts input:checked+span{border-color:var(--teal);background:#eef7f7;color:var(--teal);font-weight:700}
.opts input:focus-visible+span{outline:2px solid var(--teal)}
.sfoot{display:flex;align-items:center;gap:10px;margin-top:12px}
.sfoot .pn{font-size:13px;color:var(--sub);flex:1}
.sfoot button{border:0;border-radius:8px;padding:11px 18px;font-size:15px;font-weight:700;cursor:pointer}
#startRun{background:var(--teal);color:#fff}
#startRun:disabled{opacity:.4}
#closeSetup{background:#eceff3;color:var(--ink)}
.result{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px}
.result h2{margin:0 0 6px;color:var(--navy);font-size:18px}
.score{font-size:18px}.score b{font-size:30px;color:var(--teal)}
.result .sub{font-size:13px;color:var(--sub);margin-top:2px}
.rlist{list-style:none;padding:0;margin:12px 0}
.rlist li{display:flex;align-items:center;gap:8px;padding:7px 4px;border-top:1px solid var(--line);font-size:13px;cursor:pointer;flex-wrap:wrap}
.rlist .rm{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.ri{width:22px;text-align:center;font-weight:700;font-size:16px}
.ri.ok{color:var(--ok)}.ri.ng{color:var(--ng)}.ri.un{color:#aaa}
.rd{color:var(--sub);font-size:12px}
.rbtns{display:flex;gap:8px;flex-wrap:wrap}
.rbtns button{flex:1;border:0;border-radius:8px;padding:11px;font-size:14px;font-weight:700;cursor:pointer;background:var(--teal);color:#fff}
.rbtns button.sec{background:#eceff3;color:var(--ink)}
</style>
</head>
<body>
<header><div class="hd">
<div class="kicker"><a href="../../化学/">化学</a>　/　過去問 正誤問題</div>
<h1>化学ファイナルチェックお試し</h1>
<p>共通テスト 2021〜2026（本試・追試）／センター試験 2015〜2020（本試・追試）　全202問．各記述を ○× で判定してから「答え合わせ」．見出しに（改）とある問題は，誤りを含む記述の数が問題ごとにばらばらになるように記述を改め，各記述に ○× をつける形式にした改題です．</p>
<button type="button" class="go-run" id="openSetup">🎯 演習モード（ランダム・タイマー）</button>
</div></header>
<nav>
<div class="tabs" id="tabs"></div>
<div class="filters">
<span class="chip on" data-f="all">すべて</span>
<span class="chip" data-f="kyotsu">共テのみ</span>
<span class="chip" data-f="center">センターのみ</span>
<span class="chip" data-f="ng">×だけ</span>
<span class="chip" data-f="un">未チェック</span>
<span class="stat" id="stat"></span>
</div>
</nav>
<main id="main"></main>
<button class="top" id="top" aria-label="上へ">↑</button>

<div class="setup" id="setup" role="dialog" aria-modal="true" aria-label="演習モードの設定">
<div class="sbox">
<h2>演習モード</h2>
<fieldset><legend>出題範囲（章）</legend><div class="opts">
<label><input type="checkbox" name="sch" value="1" checked><span>1. 物質の状態と構造</span></label>
<label><input type="checkbox" name="sch" value="2" checked><span>2. 物質の変化と平衡</span></label>
<label><input type="checkbox" name="sch" value="3" checked><span>3. 無機物質</span></label>
<label><input type="checkbox" name="sch" value="4" checked><span>4. 有機化合物</span></label>
<label><input type="checkbox" name="sch" value="5" checked><span>5. 天然有機化合物と高分子化合物</span></label>
</div></fieldset>
<fieldset><legend>出典</legend><div class="opts">
<label><input type="radio" name="src" value="all" checked><span>すべて</span></label>
<label><input type="radio" name="src" value="kyotsu"><span>共通テスト</span></label>
<label><input type="radio" name="src" value="center"><span>センター試験</span></label>
</div></fieldset>
<fieldset><legend>対象</legend><div class="opts">
<label><input type="radio" name="tgt" value="all" checked><span>すべて</span></label>
<label><input type="radio" name="tgt" value="ng"><span>×をつけた問題</span></label>
<label><input type="radio" name="tgt" value="un"><span>未チェック</span></label>
<label><input type="radio" name="tgt" value="ngun"><span>○以外</span></label>
</div></fieldset>
<fieldset><legend>問題数</legend><div class="opts">
<label><input type="radio" name="cnt" value="5"><span>5問</span></label>
<label><input type="radio" name="cnt" value="10" checked><span>10問</span></label>
<label><input type="radio" name="cnt" value="20"><span>20問</span></label>
<label><input type="radio" name="cnt" value="all"><span>全部</span></label>
</div></fieldset>
<fieldset><legend>出題順</legend><div class="opts">
<label><input type="radio" name="ord" value="rand" checked><span>ランダム</span></label>
<label><input type="radio" name="ord" value="seq"><span>番号順</span></label>
</div></fieldset>
<fieldset><legend>選択肢の順番</legend><div class="opts">
<label><input type="radio" name="chs" value="rand" checked><span>ランダム</span></label>
<label><input type="radio" name="chs" value="keep"><span>そのまま</span></label>
</div></fieldset>
<fieldset><legend>制限時間</legend><div class="opts">
<label><input type="radio" name="tm" value="0" checked><span>なし</span></label>
<label><input type="radio" name="tm" value="90"><span>1問 1分30秒</span></label>
<label><input type="radio" name="tm" value="120"><span>1問 2分</span></label>
<label><input type="radio" name="tm" value="180"><span>1問 3分</span></label>
</div></fieldset>
<div class="sfoot"><span class="pn">対象 <b id="poolN">0</b> 問</span><button type="button" id="closeSetup">閉じる</button><button type="button" id="startRun">スタート</button></div>
</div></div>

<script src="katex/katex.min.js?v=202611130008"></script>
<script src="katex/mhchem.min.js?v=202611130008"></script>
<script src="data.js?v=202611130008"></script>
<script src="app.js?v=202611130008"></script>
</body>
</html>
