<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>確認テスト - 化学</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif; background: #f5f5f7; color: #1d1d1f; min-height: 100vh; }
    header { background: #fff; border-bottom: 1px solid #d2d2d7; padding: 20px 40px; position: sticky; top: 0; z-index: 100; }
    .back-link { text-decoration: none; color: #007aff; font-size: 14px; }
    .back-link:hover { text-decoration: underline; }
    header h1 { font-size: 24px; font-weight: 600; margin-top: 8px; }
    header p { font-size: 13px; color: #86868b; margin-top: 4px; }
    .container { max-width: 960px; margin: 32px auto; padding: 0 20px; }
    .pdf-list { display: flex; flex-direction: column; }
    .pdf-item { background: #fff; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #f0f0f5; transition: background 0.2s; }
    .pdf-item:first-child { border-radius: 12px 12px 0 0; }
    .pdf-item:last-child { border-bottom: none; border-radius: 0 0 12px 12px; }
    .pdf-item:only-child { border-radius: 12px; }
    .pdf-item:hover { background: #fafafa; }
    .pdf-info { display: flex; align-items: center; gap: 14px; min-width: 0; }
    .pdf-icon { width: 38px; height: 38px; background: #ff3b30; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 11px; flex-shrink: 0; }
    .pdf-name { font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pdf-meta { font-size: 12px; color: #86868b; margin-top: 2px; }
    .pdf-actions { display: flex; gap: 8px; flex-shrink: 0; }
    .btn { padding: 7px 14px; border-radius: 8px; border: none; font-size: 13px; font-weight: 500; cursor: pointer; text-decoration: none; transition: background 0.2s; display: inline-block; text-align: center; }
    .btn-view { background: #007aff; color: #fff; }
    .btn-view:hover { background: #0066d6; }
    .btn-dl { background: #e8e8ed; color: #1d1d1f; }
    .btn-dl:hover { background: #d2d2d7; }

    /* PDF Viewer (desktop: modal, mobile/PWA: fullscreen) */
    .viewer-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 200; justify-content: center; align-items: center; }
    .viewer-overlay.active { display: flex; }
    .viewer { background: #fff; border-radius: 16px; width: 90vw; height: 90vh; display: flex; flex-direction: column; overflow: hidden; }
    .viewer-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; border-bottom: 1px solid #d2d2d7; background: #fff; flex-shrink: 0; }
    .viewer-header h2 { font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; margin-right: 12px; }
    .viewer-close { padding: 6px 16px; border-radius: 8px; border: none; background: #e8e8ed; font-size: 14px; cursor: pointer; font-weight: 500; }
    .viewer-close:hover { background: #d2d2d7; }
    .viewer-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; background: #525659; padding: 8px 0; }
    .viewer-body canvas { display: block; margin: 4px auto; max-width: 100%; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
    .viewer-loading { text-align: center; padding: 40px; color: #fff; font-size: 14px; }
    .viewer-page-info { text-align: center; color: #aaa; font-size: 12px; padding: 4px 0; }

    @media (max-width: 600px) {
      header { padding: 16px 20px; }
      .pdf-item { flex-direction: column; align-items: flex-start; gap: 10px; }
      .pdf-actions { width: 100%; }
      .btn { flex: 1; text-align: center; }
      .viewer { width: 100vw; height: 100vh; border-radius: 0; }
      .viewer-overlay { background: #000; }
    }
  </style>
</head>
<body>
  <header>
    <a class="back-link" href="../">← 化学 に戻る</a>
    <h1>確認テスト</h1>
    <p id="update-time"></p>
  </header>
  <div class="container"><div class="pdf-list" id="pdf-list"><div style="padding:80px;text-align:center;color:#86868b">読み込み中...</div></div></div>

  <!-- PDF Viewer -->
  <div class="viewer-overlay" id="viewer">
    <div class="viewer">
      <div class="viewer-header">
        <h2 id="viewer-title">PDF</h2>
        <button class="viewer-close" onclick="closeViewer()">閉じる</button>
      </div>
      <div class="viewer-body" id="viewer-body">
        <div class="viewer-loading" id="viewer-loading">読み込み中...</div>
      </div>
    </div>
  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    async function load() {
      try {
        var res = await fetch('../../filelist.json?' + Date.now());
        var data = await res.json();
        document.getElementById('update-time').textContent = '最終更新: ' + data.updated;
        var folder = data.folders.find(function(f) { return f.name === '化学'; });
        if (!folder) return;
        var sub = folder.subs.find(function(s) { return s.name === '確認テスト'; });
        var el = document.getElementById('pdf-list');
        if (!sub || sub.files.length === 0) { el.innerHTML = '<div style="padding:80px;text-align:center;color:#86868b">PDFがありません</div>'; return; }
        el.innerHTML = sub.files.map(function(f) {
          var path = '../../pdfs/化学/確認テスト/' + encodeURIComponent(f.name);
          return '<div class="pdf-item"><div class="pdf-info"><div class="pdf-icon">PDF</div><div><div class="pdf-name">' + f.name + '</div><div class="pdf-meta">' + f.size + '</div></div></div><div class="pdf-actions"><button class="btn btn-view" onclick="openViewer(\x27' + f.name.replace(/'/g,"\\'") + '\x27,\x27' + path + '\x27)">閲覧</button><a class="btn btn-dl" href="' + path + '" download>DL</a></div></div>';
        }).join('');
      } catch(e) { document.getElementById('pdf-list').innerHTML = '<div style="padding:80px;text-align:center;color:#86868b">読み込み失敗</div>'; }
    }

    var currentPdf = null;
    async function openViewer(name, path) {
      document.getElementById('viewer-title').textContent = name;
      document.getElementById('viewer').classList.add('active');
      var body = document.getElementById('viewer-body');
      body.innerHTML = '<div class="viewer-loading">読み込み中...</div>';
      body.scrollTop = 0;

      try {
        var pdf = await pdfjsLib.getDocument(path).promise;
        currentPdf = pdf;
        body.innerHTML = '';
        var scale = window.innerWidth < 600 ? 1.5 : 2.0;

        for (var i = 1; i <= pdf.numPages; i++) {
          var page = await pdf.getPage(i);
          var viewport = page.getViewport({ scale: scale });
          var canvas = document.createElement('canvas');
          canvas.width = viewport.width;
          canvas.height = viewport.height;
          canvas.style.width = '100%';
          canvas.style.height = 'auto';
          body.appendChild(canvas);
          var ctx = canvas.getContext('2d');
          await page.render({ canvasContext: ctx, viewport: viewport }).promise;

          if (i % 5 === 0 || i === pdf.numPages) {
            var info = document.createElement('div');
            info.className = 'viewer-page-info';
            info.textContent = i + ' / ' + pdf.numPages;
            body.appendChild(info);
          }
        }
      } catch(e) {
        body.innerHTML = '<div class="viewer-loading">PDF の読み込みに失敗しました</div>';
      }
    }

    function closeViewer() {
      document.getElementById('viewer').classList.remove('active');
      document.getElementById('viewer-body').innerHTML = '';
      currentPdf = null;
    }

    document.getElementById('viewer').addEventListener('click', function(e) { if (e.target === this) closeViewer(); });
    document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeViewer(); });
    load();
  </script>
</body>
</html>
