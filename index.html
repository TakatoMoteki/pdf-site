<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#fafaf7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d0e14" media="(prefers-color-scheme: dark)">
  <title>PDF ライブラリ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #fafaf7; --surface: #ffffff; --ink: #16171f; --ink-soft: #6b6d7c;
      --grid: rgba(20,22,40,0.05); --line: #e8e6df;
      --phys: #2d5fd6; --phys-soft: rgba(45,95,214,0.08);
      --chem: #d6452f; --chem-soft: rgba(214,69,47,0.08);
      --shadow: 0 2px 12px rgba(20,22,40,0.05);
      --shadow-lift: 0 18px 48px rgba(20,22,40,0.14);
    }
    [data-theme="dark"] {
      --paper: #0d0e14; --surface: #161824; --ink: #ECECF2; --ink-soft: #8b8da3;
      --grid: rgba(180,190,255,0.045); --line: #262838;
      --phys: #6f9bff; --phys-soft: rgba(111,155,255,0.12);
      --chem: #ff7a64; --chem-soft: rgba(255,122,100,0.12);
      --shadow: 0 2px 12px rgba(0,0,0,0.3);
      --shadow-lift: 0 18px 48px rgba(0,0,0,0.55);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Zen Kaku Gothic New", -apple-system, sans-serif;
      background: var(--paper); color: var(--ink); min-height: 100vh;
      background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: 26px 26px;
      transition: background-color 0.4s, color 0.4s;
    }
    header {
      padding: 28px 40px; display: flex; align-items: flex-start; justify-content: space-between;
      border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--paper) 80%, transparent);
      backdrop-filter: blur(12px); position: sticky; top: 0; z-index: 100;
    }
    .brand .eyebrow {
      font-family: "Space Grotesk", monospace; font-size: 11px; font-weight: 600;
      letter-spacing: 0.22em; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 6px;
    }
    .brand h1 { font-family: "Space Grotesk", "Zen Kaku Gothic New", sans-serif; font-size: 27px; font-weight: 700; letter-spacing: -0.02em; line-height: 1; }
    .brand p { font-family: "JetBrains Mono", monospace; font-size: 11px; color: var(--ink-soft); margin-top: 8px; }
    .theme-toggle {
      width: 46px; height: 46px; border-radius: 14px; border: 1px solid var(--line);
      background: var(--surface); cursor: pointer; font-size: 19px; display: flex;
      align-items: center; justify-content: center; transition: transform 0.2s, border-color 0.2s; flex-shrink: 0;
    }
    .theme-toggle:hover { transform: rotate(-12deg) scale(1.06); border-color: var(--ink-soft); }
    .container { max-width: 880px; margin: 0 auto; padding: 64px 32px 80px; }
    .lede { font-size: 14px; color: var(--ink-soft); margin-bottom: 40px; max-width: 440px; line-height: 1.7; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 28px; }
    .tile {
      position: relative; background: var(--surface); border: 1px solid var(--line);
      border-radius: 22px; padding: 30px; cursor: pointer; width: 100%; text-align: left;
      font-family: inherit; color: var(--ink); box-shadow: var(--shadow);
      transition: transform 0.3s cubic-bezier(0.2,0.8,0.2,1), box-shadow 0.3s, border-color 0.3s;
      overflow: hidden; aspect-ratio: 1 / 1; display: flex; flex-direction: column; justify-content: space-between;
    }
    .tile::after {
      content: ""; position: absolute; inset: 0; background: var(--tile-soft);
      opacity: 0; transition: opacity 0.3s; pointer-events: none;
    }
    .tile:hover { transform: translateY(-6px); box-shadow: var(--shadow-lift); border-color: var(--tile-accent); }
    .tile:hover::after { opacity: 1; }
    .tile-top { display: flex; align-items: flex-start; justify-content: space-between; position: relative; z-index: 1; }
    .tile-num { font-family: "JetBrains Mono", monospace; font-size: 13px; font-weight: 600; color: var(--tile-accent); }
    .tile-cat { font-family: "JetBrains Mono", monospace; font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--ink-soft); text-align: right; }
    .tile-symbol {
      font-family: "Space Grotesk", sans-serif; font-size: 92px; font-weight: 700;
      line-height: 0.9; color: var(--tile-accent); position: relative; z-index: 1; letter-spacing: -0.04em;
    }
    .tile-foot { position: relative; z-index: 1; }
    .tile-name { font-size: 24px; font-weight: 900; letter-spacing: 0.02em; }
    .tile-en { font-family: "Space Grotesk", monospace; font-size: 12px; color: var(--ink-soft); margin-top: 2px; letter-spacing: 0.05em; }
    .phys { --tile-accent: var(--phys); --tile-soft: var(--phys-soft); }
    .chem { --tile-accent: var(--chem); --tile-soft: var(--chem-soft); }
    .empty { padding: 80px; text-align: center; color: var(--ink-soft); grid-column: 1/-1; }
    .pw-overlay { display: none; position: fixed; inset: 0; background: rgba(8,9,14,0.55); z-index: 300; justify-content: center; align-items: center; backdrop-filter: blur(10px); }
    .pw-overlay.active { display: flex; }
    .pw-box { background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: 38px 34px; max-width: 380px; width: 90%; box-shadow: var(--shadow-lift); }
    .pw-symbol { font-family: "Space Grotesk", sans-serif; font-size: 44px; font-weight: 700; line-height: 1; color: var(--pw-accent); margin-bottom: 12px; }
    .pw-box h3 { font-size: 18px; font-weight: 700; margin-bottom: 22px; }
    .pw-box input[type="text"], .pw-box input[type="password"] { width: 100%; padding: 15px 18px; border-radius: 13px; border: 1px solid var(--line); font-size: 16px; outline: none; margin-bottom: 14px; font-family: inherit; background: var(--paper); color: var(--ink); transition: border-color 0.2s; }
    .pw-box input:focus { border-color: var(--pw-accent); }
    .pw-submit { width: 100%; padding: 15px; border-radius: 13px; border: none; background: var(--pw-accent); color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; font-family: inherit; transition: opacity 0.2s; }
    .pw-submit:hover { opacity: 0.9; }
    .pw-error { color: #e0392b; font-size: 13px; margin-bottom: 10px; display: none; }
    .pw-cancel { width: 100%; padding: 12px; border: none; background: transparent; color: var(--ink-soft); margin-top: 6px; font-size: 14px; cursor: pointer; font-family: inherit; }
    .phys-pw { --pw-accent: var(--phys); }
    .chem-pw { --pw-accent: var(--chem); }
    @media (max-width: 600px) {
      header { padding: 22px 24px; }
      .container { padding: 40px 24px 60px; }
      .tile { aspect-ratio: auto; min-height: 220px; }
      .tile-symbol { font-size: 72px; }
    }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="eyebrow">Lecture Archive</div>
      <h1>PDF ライブラリ</h1>
      <p id="update-time"></p>
    </div>
    <button class="theme-toggle" id="theme-toggle" title="テーマ切り替え">🌙</button>
  </header>
  <div class="container">
    <p class="lede">授業プリント・確認テストのアーカイブ。科目を選んでパスワードを入力してください。</p>
    <div class="grid" id="folders"></div>
  </div>

  <div class="pw-overlay phys-pw" id="pw-overlay-物理">
    <div class="pw-box">
      <div class="pw-symbol">Ph</div>
      <h3>物理 — パスワード</h3>
      <div class="pw-error" id="pw-error-物理">パスワードが違います</div>
      <form id="pw-form-物理" method="post" action="javascript:void(0)">
        <input type="text" name="username" value="pdf-物理" autocomplete="username" style="position:absolute;opacity:0;height:0;overflow:hidden;pointer-events:none" tabindex="-1">
        <input type="password" id="pw-input-物理" name="password" autocomplete="current-password" placeholder="パスワードを入力">
        <button type="submit" class="pw-submit">開く</button>
      </form>
      <button class="pw-cancel" onclick="closePw('物理')">キャンセル</button>
    </div>
  </div>

  <div class="pw-overlay chem-pw" id="pw-overlay-化学">
    <div class="pw-box">
      <div class="pw-symbol">Ch</div>
      <h3>化学 — パスワード</h3>
      <div class="pw-error" id="pw-error-化学">パスワードが違います</div>
      <form id="pw-form-化学" method="post" action="javascript:void(0)">
        <input type="text" name="username" value="pdf-化学" autocomplete="username" style="position:absolute;opacity:0;height:0;overflow:hidden;pointer-events:none" tabindex="-1">
        <input type="password" id="pw-input-化学" name="password" autocomplete="current-password" placeholder="パスワードを入力">
        <button type="submit" class="pw-submit">開く</button>
      </form>
      <button class="pw-cancel" onclick="closePw('化学')">キャンセル</button>
    </div>
  </div>

  <script>
    function applyTheme(t) {
      document.documentElement.setAttribute('data-theme', t);
      document.getElementById('theme-toggle').textContent = t === 'dark' ? '☀️' : '🌙';
      localStorage.setItem('pdf-site-theme', t);
    }
    var saved = localStorage.getItem('pdf-site-theme');
    applyTheme(saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
    document.getElementById('theme-toggle').addEventListener('click', function() {
      applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
    });

    var HASHES = {
      '物理': '47d662997d0dde2569663e46e3346b6f71f82a297ae6507fcb525ac5112a39c7',
      '化学': '94680fd24bf04a3e411f3772c611057d39a3f67999858aa768fb927225542300'
    };
    var SYMBOLS = { '物理': 'Ph', '化学': 'Ch' };
    var EN = { '物理': 'Physics', '化学': 'Chemistry' };
    async function sha256(str) {
      var buf = new TextEncoder().encode(str);
      var hash = await crypto.subtle.digest('SHA-256', buf);
      return Array.from(new Uint8Array(hash)).map(function(b) { return b.toString(16).padStart(2, '0'); }).join('');
    }
    async function load() {
      try {
        var res = await fetch('filelist.json?' + Date.now());
        var data = await res.json();
        document.getElementById('update-time').textContent = 'updated ' + data.updated;
        var el = document.getElementById('folders');
        if (!data.folders || data.folders.length === 0) { el.innerHTML = '<div class="empty">フォルダがありません</div>'; return; }
        el.innerHTML = data.folders.map(function(f) {
          var cls = f.name === '物理' ? 'phys' : 'chem';
          var sym = SYMBOLS[f.name] || f.name.charAt(0);
          var en = EN[f.name] || '';
          var num = String(f.totalFiles).padStart(2, '0');
          return '<button class="tile ' + cls + '" onclick="tryOpen(\'' + f.name + '\')">' +
            '<div class="tile-top"><span class="tile-num">' + num + '</span><span class="tile-cat">' + (f.subs ? f.subs.length : 0) + ' categories</span></div>' +
            '<div class="tile-symbol">' + sym + '</div>' +
            '<div class="tile-foot"><div class="tile-name">' + f.name + '</div><div class="tile-en">' + en + '</div></div>' +
            '</button>';
        }).join('');
      } catch(e) { document.getElementById('folders').innerHTML = '<div class="empty">読み込みに失敗しました</div>'; }
    }
    function tryOpen(subject) {
      if (sessionStorage.getItem('pw_' + subject) === 'ok') { location.href = encodeURIComponent(subject) + '/'; return; }
      var overlay = document.getElementById('pw-overlay-' + subject);
      var input = document.getElementById('pw-input-' + subject);
      document.getElementById('pw-error-' + subject).style.display = 'none';
      input.value = '';
      overlay.classList.add('active');
      setTimeout(function() { input.focus(); }, 100);
    }
    function closePw(subject) { document.getElementById('pw-overlay-' + subject).classList.remove('active'); }
    ['物理', '化学'].forEach(function(subject) {
      var form = document.getElementById('pw-form-' + subject);
      form.addEventListener('submit', async function(e) {
        e.preventDefault();
        var input = document.getElementById('pw-input-' + subject);
        var hash = await sha256(input.value);
        if (hash === HASHES[subject]) {
          sessionStorage.setItem('pw_' + subject, 'ok');
          form.action = location.href;
          setTimeout(function() { form.action = 'javascript:void(0)'; location.href = encodeURIComponent(subject) + '/'; }, 100);
        } else {
          document.getElementById('pw-error-' + subject).style.display = 'block';
          input.value = ''; input.focus();
        }
      });
      document.getElementById('pw-overlay-' + subject).addEventListener('click', function(e) { if (e.target === this) closePw(subject); });
    });
    load();
  </script>
</body>
</html>
