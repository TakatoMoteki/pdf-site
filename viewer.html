<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>PDF Viewer</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #2a2a2e; font-family: -apple-system, sans-serif; }
    .toolbar {
      position: sticky; top: 0; z-index: 100;
      background: #38383d; padding: 10px 16px;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid #4a4a4f;
    }
    .toolbar a { color: #45a1ff; text-decoration: none; font-size: 14px; }
    .toolbar .info { color: #b1b1b3; font-size: 13px; }
    .toolbar .dl-btn {
      background: #45a1ff; color: #fff; border: none; padding: 6px 14px;
      border-radius: 6px; font-size: 13px; cursor: pointer; text-decoration: none;
    }
    #pages { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px 0; }
    #pages canvas {
      display: block; max-width: 100%; height: auto;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    .loading {
      color: #b1b1b3; text-align: center; padding: 60px 20px; font-size: 16px;
    }
    .error { color: #ff6b6b; text-align: center; padding: 60px 20px; font-size: 16px; }
  </style>
</head>
<body>
  <div class="toolbar">
    <a href="javascript:history.back()">← 戻る</a>
    <span class="info" id="page-info"></span>
    <a class="dl-btn" id="dl-btn" href="#" download>ダウンロード</a>
  </div>
  <div id="pages"><div class="loading" id="status">読み込み中...</div></div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    var params = new URLSearchParams(window.location.search);
    var pdfUrl = params.get('file');
    var pdfName = params.get('name') || 'PDF';
    document.title = pdfName;

    var dlBtn = document.getElementById('dl-btn');
    dlBtn.href = pdfUrl;
    dlBtn.download = pdfName;

    if (!pdfUrl) {
      document.getElementById('status').className = 'error';
      document.getElementById('status').textContent = 'PDFが指定されていません';
    } else {
      var container = document.getElementById('pages');
      var statusEl = document.getElementById('status');
      var pageInfo = document.getElementById('page-info');
      var maxWidth = Math.min(window.innerWidth - 24, 1200);
      var scale = window.devicePixelRatio || 1;

      pdfjsLib.getDocument({
        url: pdfUrl,
        cMapUrl: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/cmaps/',
        cMapPacked: true,
        standardFontDataUrl: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/standard_fonts/'
      }).promise.then(function(pdf) {
        statusEl.style.display = 'none';
        pageInfo.textContent = pdf.numPages + 'ページ';
        var rendered = 0;

        function renderPage(num) {
          pdf.getPage(num).then(function(page) {
            var vp = page.getViewport({ scale: 1 });
            var displayScale = maxWidth / vp.width;
            var viewport = page.getViewport({ scale: displayScale * scale });
            var canvas = document.createElement('canvas');
            canvas.width = viewport.width;
            canvas.height = viewport.height;
            canvas.style.width = (viewport.width / scale) + 'px';
            canvas.style.height = (viewport.height / scale) + 'px';
            container.appendChild(canvas);
            var ctx = canvas.getContext('2d');
            page.render({ canvasContext: ctx, viewport: viewport }).promise.then(function() {
              rendered++;
              if (rendered < pdf.numPages) renderPage(rendered + 1);
            });
          });
        }
        renderPage(1);
      }).catch(function(err) {
        statusEl.className = 'error';
        statusEl.textContent = 'PDFの読み込みに失敗しました';
        console.error(err);
      });
    }
  </script>
</body>
</html>
