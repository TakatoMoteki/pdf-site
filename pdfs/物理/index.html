<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>物理 - PDF ライブラリ</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
      background: #f5f5f7; color: #1d1d1f; min-height: 100vh;
    }
    header {
      background: #fff; border-bottom: 1px solid #d2d2d7;
      padding: 20px 40px; position: sticky; top: 0; z-index: 100;
    }
    .header-top { display: flex; align-items: center; gap: 12px; }
    .back-link {
      text-decoration: none; color: #007aff; font-size: 14px;
      display: flex; align-items: center; gap: 4px;
    }
    .back-link:hover { text-decoration: underline; }
    header h1 { font-size: 24px; font-weight: 600; }
    header p { font-size: 13px; color: #86868b; margin-top: 4px; }
    .container { max-width: 960px; margin: 32px auto; padding: 0 20px; }
    .pdf-list { display: flex; flex-direction: column; gap: 0; }
    .pdf-item {
      background: #fff; padding: 16px 24px;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid #f0f0f5; transition: background 0.2s;
    }
    .pdf-item:first-child { border-radius: 12px 12px 0 0; }
    .pdf-item:last-child { border-bottom: none; border-radius: 0 0 12px 12px; }
    .pdf-item:only-child { border-radius: 12px; }
    .pdf-item:hover { background: #fafafa; }
    .pdf-info { display: flex; align-items: center; gap: 14px; min-width: 0; }
    .pdf-icon {
      width: 38px; height: 38px; background: #ff3b30; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-weight: 700; font-size: 11px; flex-shrink: 0;
    }
    .pdf-name { font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pdf-meta { font-size: 12px; color: #86868b; margin-top: 2px; }
    .pdf-actions { display: flex; gap: 8px; flex-shrink: 0; }
    .btn {
      padding: 7px 14px; border-radius: 8px; border: none;
      font-size: 13px; font-weight: 500; cursor: pointer;
      text-decoration: none; transition: background 0.2s;
    }
    .btn-view { background: #007aff; color: #fff; }
    .btn-view:hover { background: #0066d6; }
    .btn-dl { background: #e8e8ed; color: #1d1d1f; }
    .btn-dl:hover { background: #d2d2d7; }
    .empty { text-align: center; padding: 80px 20px; color: #86868b; font-size: 16px; }
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.6); z-index: 200;
      justify-content: center; align-items: center;
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: #fff; border-radius: 16px; width: 90vw; height: 90vh;
      display: flex; flex-direction: column; overflow: hidden;
    }
    .modal-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 20px; border-bottom: 1px solid #d2d2d7;
    }
    .modal-header h2 { font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .modal-close {
      width: 32px; height: 32px; border-radius: 50%; border: none;
      background: #e8e8ed; font-size: 18px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .modal-close:hover { background: #d2d2d7; }
    .modal-body { flex: 1; overflow: hidden; }
    .modal-body iframe { width: 100%; height: 100%; border: none; }
    @media (max-width: 600px) {
      header { padding: 16px 20px; }
      .pdf-item { flex-direction: column; align-items: flex-start; gap: 10px; }
      .pdf-actions { width: 100%; }
      .btn { flex: 1; text-align: center; }
      .modal { width: 100vw; height: 100vh; border-radius: 0; }
    }
  </style>
</head>
<body>
  <header>
    <a class="back-link" href="../">← トップに戻る</a>
    <h1>物理</h1>
    <p id="update-time"></p>
  </header>
  <div class="container">
    <div class="pdf-list" id="pdf-list">
      <div class="empty">読み込み中...</div>
    </div>
  </div>
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modal-title">PDF</h2>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body">
        <iframe id="modal-iframe"></iframe>
      </div>
    </div>
  </div>
  <script>
    var SUBJECT = "物理";
    async function load() {
      try {
        var res = await fetch('../filelist.json?' + Date.now());
        var data = await res.json();
        document.getElementById('update-time').textContent = '最終更新: ' + data.updated;
        var folder = data.folders.find(function(f) { return f.name === SUBJECT; });
        var el = document.getElementById('pdf-list');
        if (!folder || folder.files.length === 0) {
          el.innerHTML = '<div class="empty">PDFファイルがありません</div>';
          return;
        }
        el.innerHTML = folder.files.map(function(f) {
          var path = encodeURIComponent(f.name);
          return '<div class="pdf-item">'
            + '<div class="pdf-info"><div class="pdf-icon">PDF</div><div>'
            + '<div class="pdf-name">' + f.name + '</div>'
            + '<div class="pdf-meta">' + f.size + '</div>'
            + '</div></div><div class="pdf-actions">'
            + '<button class="btn btn-view" onclick="openModal(\x27' + f.name.replace(/'/g, "\\'") + '\x27, \x27' + path + '\x27)">閲覧</button>'
            + '<a class="btn btn-dl" href="' + path + '" download>DL</a>'
            + '</div></div>';
        }).join('');
      } catch(e) {
        document.getElementById('pdf-list').innerHTML = '<div class="empty">読み込みに失敗しました</div>';
      }
    }
    function openModal(name, path) {
      document.getElementById('modal-title').textContent = name;
      document.getElementById('modal-iframe').src = path;
      document.getElementById('modal').classList.add('active');
    }
    function closeModal() {
      document.getElementById('modal').classList.remove('active');
      document.getElementById('modal-iframe').src = '';
    }
    document.getElementById('modal').addEventListener('click', function(e) { if (e.target === this) closeModal(); });
    document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeModal(); });
    load();
  </script>
</body>
</html>
